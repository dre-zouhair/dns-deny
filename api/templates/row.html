<div class="tail-row"><span class="tail-time">{{ time }}</span><code class="tail-client">{{ entry.client_ip }}{% if alias %} ({{ alias }}){% endif %}</code><button class="copyable copy-button mono-cell tail-domain" type="button" data-copy="{{ entry.name }}">{{ entry.name }}</button><span class="tail-type">{{ entry.qtype }}</span><span class="{% if entry.verdict == 'Block' %}verdict-block{% else %}verdict-pass{% endif %}">{{ entry.verdict }}</span><span class="tail-latency">{{ duration }}</span></div>
