{% extends 'base.html' %}
{% block body %}
<div class="login-page"><form class="login-card" id="login-form" method="post" action="/ui/auth/login">
  <div class="login-brand">
    <span class="sidebar-brand-icon" style="width: 36px; height: 36px;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    </span>
    <h1>dns<span class="brand-divider">—</span>deny<span class="brand-period">.</span></h1>
  </div>
  <p>Sign in to manage DNS protection across your browser tabs.</p>
  <input type="hidden" name="next" value="{{ next }}">
  <label class="form-group">Admin password or API key<input class="input" id="api-key-input" name="password" type="password" autocomplete="current-password" required autofocus></label>
  {% if error %}<p id="login-error" class="rules-error" role="alert">{{ error }}</p>{% endif %}
  <button class="btn btn-primary" type="submit">Sign In</button>
</form></div>
{% endblock %}
