# Primary Upstream DNS Resolvers (DNS-over-TLS)
[[upstreams]]
address = "1.1.1.1"
protocol = "dot"
tls_sni = "cloudflare-dns.com"

[[upstreams]]
address = "1.0.0.1"
protocol = "dot"
tls_sni = "cloudflare-dns.com"

[[upstreams]]
address = "9.9.9.9"
protocol = "dot"
tls_sni = "dns.quad9.net"

[[upstreams]]
address = "149.112.112.112"
protocol = "dot"
tls_sni = "dns.quad9.net"

# Auto-Block Discovery Upstreams (Threat & Malicious IP Detection)
[[auto_block_upstreams]]
address = "1.1.1.2"
protocol = "dot"
tls_sni = "security.cloudflare-dns.com"

[[auto_block_upstreams]]
address = "1.0.0.2"
protocol = "dot"
tls_sni = "security.cloudflare-dns.com"
