[package]
name = "dns-deny"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["core", "filter", "ingest", "logger", "api", "scoring", "rule_types"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
async-trait = "0.1.89"
hickory-server = { version = "0.26.2", features = ["resolver"] }
hickory-proto = "0.26.3"
hickory-resolver = { version = "0.26.2", features = ["tokio", "tls-ring", "https-ring", "dnssec-ring", "webpki-roots", "recursor"] }
tokio = { version = "1.54.1", features = ["full"] } # standard stable tokio
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
socket2 = "0.6.5"
dashmap = "6.2.1"
moka = { version = "0.12.15", features = ["future", "sync"] }
ahash = "0.8"
regex = "1.11.1"
ipnet = "2.12"
rusqlite = { version = "0.32.1", features = ["bundled"] }
arc-swap = "1.7.1"
idna = "1.0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
tokio-cron-scheduler = "0.13"
chrono = "0.4"
axum = "0.8.1" # Using compatible 0.8 version
serde_json = "1.0"
tower-http = { version = "0.6.2", features = ["cors", "trace", "limit"] }
tokio-stream = { version = "0.1", features = ["sync"] } # helpful for SSE / streams
bcrypt = "0.15"

[features]
default = ["feat-api", "feat-json-api", "feat-web-ui"]
# Admin HTTP server. It needs feat-web-ui (dashboard) and/or feat-json-api
# (/api/v1); enabling either one enables the server.
feat-api = ["dep:api"]
feat-json-api = ["feat-api", "api/feat-json-api"]
feat-web-ui = ["feat-api", "api/feat-web-ui"]
feat-scoring = ["dep:scoring", "api/feat-scoring", "core_dns/feat-scoring"]

[dependencies]
core_dns = { path = "core" }
filter = { path = "filter" }
logger = { path = "logger" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
arc-swap = { workspace = true }
hickory-resolver = { workspace = true }
api = { path = "api", optional = true, default-features = false }
scoring = { path = "scoring", optional = true }

[dev-dependencies]
tempfile = "3"
