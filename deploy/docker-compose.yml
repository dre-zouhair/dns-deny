services:
  dns-deny:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: dns-deny
    restart: unless-stopped
    # Mount a custom config file. HTTP is enabled in config.toml by default;
    # set api_allow_insecure_http = false there to require an HTTPS proxy.
    volumes:
      - ./config.toml:/etc/dns-deny/config.toml:ro
      - dns-deny-data:/var/lib/dns-deny
    ports:
      # DNS — map container port 1053 to host 1053 for rootless testing (dev mode)
      # For production, change to "53:53" and remove or change DNS_PORT to "53"
      - "1053:1053/udp"
      - "1053:1053/tcp"
      # Admin API
      - "127.0.0.1:8083:8080/tcp"
    environment:
      DNS_CONFIG: /etc/dns-deny/config.toml
      DNS_STATE_DB: /var/lib/dns-deny/state.db
      DNS_PORT: "1053"
      RUST_LOG: "dns_deny=info,core_dns=info,filter=warn,logger=info,api=info,ingest=warn"
    # Required if using port 53 directly
    # cap_add:
    #   - NET_BIND_SERVICE
    healthcheck:
      # Check the Admin API is alive; falls back gracefully if API is disabled
      test: ["CMD-SHELL", "curl -sf -H 'Authorization: Bearer ${API_KEY}' http://localhost:8080/api/v1/stats || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dns-deny-data:
