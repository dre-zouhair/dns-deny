dnssec_validation = false
ratelimit_qps_per_worker = 1000
ratelimit_window_duration_secs = 1
ratelimit_max_ips = 100000
bind_address = "0.0.0.0"
cache_l1_max_entries = 100000
cache_l2_max_size_mb = 256
cache_negative_ttl_floor_secs = 60
blocklist_urls = [
    "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts",
    "https://v.firebog.net/hosts/AdguardDNS.txt",
    "https://someonewhocares.org/hosts/zero/hosts",
    "https://urlhaus.abuse.ch/downloads/hostfile/",
]
blocklist_refresh_cron = "0 0 3 * * *"
auto_block_upstream_sinkholes = true
smart_ip_blocking = true
device_blocking_enabled = true
device_schedules = []
local_dns_records = []
client_aliases = []
blocked_services = []
custom_services = []
protection_pause_default_duration_secs = 172800
ml_scoring_enabled = false
enforce_safesearch = true
recursive_resolver_enabled = false
encrypted_upstream_enabled = false
encrypted_upstream_url = "https://cloudflare-dns.com/dns-query"
doh_upstreams = [
    "https://cloudflare-dns.com/dns-query",
    "https://dns.google/dns-query",
    "https://dns.quad9.net/dns-query",
    "https://dns.adguard-dns.com/dns-query",
    "https://doh.mullvad.net/dns-query",
]
logging_enabled = true
logging_db_path = "logs.db"
logging_channel_capacity = 100000
logging_retention_days = 90
api_enabled = true
api_port = 8080
# Allow HTTP by default; set false to require a trusted HTTPS reverse proxy.
api_allow_insecure_http = true
api_trusted_proxy_cidrs = ["127.0.0.1/32", "::1/128"]
api_bind_address = "0.0.0.0"
# Admin password, also accepted by the JSON API until an api_token is set.
# Read when the state database is first created.
api_key = "my-secure-dashboard-key-123"
# Optional JSON API token (16+ characters). Once set, only it authenticates
# /api/v1/*. Stored as a SHA-256 digest.
# api_token = "replace-with-a-long-random-token"
api_ratelimit_qps = 20

